<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#4aa8e8" />
    <title>Мастер Плиток: Три в ряд</title>
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
        background: #2f7fc4;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; outline: none; touch-action: none; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(#7fd0ff, #3b95dc); color: #fff;
        font: 800 22px/1.2 'Trebuchet MS', Arial, sans-serif; text-shadow: 0 2px 0 #1e5f99; z-index: 5;
        transition: opacity .35s;
      }
      #boot .bar { width: 220px; height: 14px; margin-top: 18px; border-radius: 8px; background: rgba(0,0,0,.2); overflow: hidden; }
      #boot .bar i { display: block; height: 100%; width: 10%; border-radius: 8px; background: linear-gradient(#ffe36b, #ffb82e); transition: width .2s; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot"><div id="boot-title">Мастер Плиток</div><div class="bar"><i id="boot-bar"></i></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
