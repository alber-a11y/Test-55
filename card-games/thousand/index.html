<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>Тысяча Экспресс</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101833;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; touch-action: none; outline: none; }
    #boot-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; color: #f3d48a; font: 900 34px Georgia, 'Times New Roman', serif; text-align: center;
      background: radial-gradient(circle at 50% 40%, #2b3d78, #0b1026); z-index: 5; letter-spacing: 2px; }
    #boot-loader .num { font-size: 92px; line-height: 1; color: #f3d48a; text-shadow: 0 6px 0 #6b4a12; }
    #boot-loader .sub { font-size: 22px; letter-spacing: 8px; color: #cfd8ff; margin-top: 8px; }
    #boot-loader .rail { width: 280px; height: 16px; margin-top: 26px; position: relative; }
    #boot-loader .bar { width: 100%; height: 12px; border-radius: 6px; background: #0008; overflow: hidden;
      border: 2px solid #8a6a2a; }
    #boot-loader .fill { height: 100%; width: 0; background: linear-gradient(#ffe39a, #d9a23a); transition: width .2s; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot-loader">
    <div class="num">1000</div>
    <div>ТЫСЯЧА ЭКСПРЕСС</div>
    <div class="sub">♠ ♥ ♣ ♦</div>
    <div class="rail"><div class="bar"><div class="fill" id="boot-fill"></div></div></div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
