<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>Дурак: Король стола</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #2a0f14;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; }
    #game canvas { display: block; touch-action: none; outline: none; }
    #boot-loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; color: #ffe8a8; font: 900 30px Georgia, 'Times New Roman', serif; text-align: center;
      background: radial-gradient(circle at 50% 40%, #8c2335, #2a0f14); z-index: 5; letter-spacing: 1px; }
    #boot-loader .suits { font-size: 44px; margin-bottom: 10px; color: #fff; }
    #boot-loader .suits b { color: #ff6b6b; }
    #boot-loader .bar { width: 260px; height: 14px; border-radius: 8px; background: #0008; margin-top: 18px; overflow: hidden; }
    #boot-loader .fill { height: 100%; width: 0; background: linear-gradient(#ffe066, #ffb703); transition: width .2s; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="boot-loader"><div class="suits">♠ <b>♥</b> ♣ <b>♦</b></div><div>ДУРАК<br/>КОРОЛЬ СТОЛА</div><div class="bar"><div class="fill" id="boot-fill"></div></div></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
